# انتشار خودکار اپلیکیشن روی GitHub Pages با هر push به main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # از collect.yml بعد از جمع‌آوری صدا زده می‌شود

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # آخرین نسخهٔ شاخه، تا دادهٔ تازه‌ای که collect.yml commit کرده هم بیاید
          ref: ${{ github.ref }}
      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r public/. _site/
          if [ -f data/stores.json ]; then
            cp data/stores.json _site/data/stores.json
          else
            echo "::warning::data/stores.json وجود ندارد؛ سایت بدون داده منتشر می‌شود."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
